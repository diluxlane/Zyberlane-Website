<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zyberlane — Fluid Effect Preview</title>
<style>
:root{--red:#e50000;--red2:#ff2a2a;--ink:#030303;--white:#f5f5f5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:saturate(1.18) contrast(1.04)}.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 0 22%,rgba(0,0,0,.18) 65%,rgba(0,0,0,.55) 100%)}main{position:relative;z-index:2;height:100%;display:grid;place-items:center;pointer-events:none}.card{text-align:center;padding:28px;max-width:720px}.eyebrow{font:600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#a9a9a9}.eyebrow b{color:var(--red2)}h1{font-size:clamp(44px,10vw,112px);letter-spacing:-.065em;line-height:.9;margin:18px 0 22px}h1 span{color:var(--red)}p{max-width:560px;margin:auto;color:#9b9b9b;font-size:clamp(14px,2.2vw,18px);line-height:1.65}.hint{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;color:#777;font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;pointer-events:none}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 18px #f00;margin-right:8px}@media(prefers-reduced-motion:reduce){canvas{display:none}}
</style></head>
<body><canvas id="fluid" aria-hidden="true"></canvas><div class="veil"></div><main><div class="card"><div class="eyebrow"><b>//</b> interactive atmosphere preview</div><h1>Zyberlane<span>.</span></h1><p>Move your cursor or drag your finger. This isolated preview tests the fluid/smoke interaction before anything is integrated into the production website.</p></div></main><div class="hint"><span class="dot"></span>move / touch to disturb the fluid</div>
<script>
(()=>{const c=document.getElementById('fluid'),x=c.getContext('2d',{alpha:true});if(!x)return;let W=0,H=0,D=1,pts=[],last=null,running=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced)return;function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});resize();const palette=[[229,0,0],[255,36,36],[145,0,0],[255,82,45]];function emit(px,py,vx,vy,power=1){const speed=Math.min(18,Math.hypot(vx,vy));const n=Math.max(3,Math.min(13,3+speed*.65));for(let i=0;i<n;i++){const col=palette[(Math.random()*palette.length)|0],life=.8+Math.random()*1.3;pts.push({x:px+(Math.random()-.5)*14,y:py+(Math.random()-.5)*14,vx:vx*(.08+Math.random()*.12)+(Math.random()-.5)*1.2,vy:vy*(.08+Math.random()*.12)+(Math.random()-.5)*1.2,r:(28+Math.random()*72)*power,life,max:life,col,spin:(Math.random()-.5)*.08})}if(pts.length>420)pts.splice(0,pts.length-420)}function pointer(e){const p=e.touches?e.touches[0]:e;if(!p)return;const now={x:p.clientX,y:p.clientY};if(last)emit(now.x,now.y,now.x-last.x,now.y-last.y,1);else emit(now.x,now.y,0,0,.7);last=now}addEventListener('pointermove',pointer,{passive:true});addEventListener('pointerdown',e=>{last=null;pointer(e)},{passive:true});addEventListener('pointerup',()=>last=null,{passive:true});addEventListener('touchmove',pointer,{passive:true});addEventListener('touchstart',e=>{last=null;pointer(e)},{passive:true});addEventListener('touchend',()=>last=null,{passive:true});let t0=performance.now(),idle=0;function frame(t){if(!running)return;const dt=Math.min(.034,(t-t0)/1000);t0=t;idle+=dt;if(idle>.9&&pts.length<80){idle=0;emit(W*(.2+Math.random()*.6),H*(.25+Math.random()*.5),(Math.random()-.5)*7,(Math.random()-.5)*5,.75)}x.globalCompositeOperation='source-over';x.fillStyle='rgba(3,3,3,.105)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.life-=dt;p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.vx*=.985;p.vy*=.985;p.vx+=Math.sin((p.y+t*.025)*.012)*p.spin;p.vy+=Math.cos((p.x-t*.02)*.01)*p.spin;p.r+=10*dt;if(p.life<=0){pts.splice(i,1);continue}const a=Math.max(0,p.life/p.max);const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(${p.col[0]},${p.col[1]},${p.col[2]},${.09*a})`);g.addColorStop(.35,`rgba(${p.col[0]},${p.col[1]},${p.col[2]},${.055*a})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()}requestAnimationFrame(frame)}x.fillStyle='#030303';x.fillRect(0,0,W,H);requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running){t0=performance.now();requestAnimationFrame(frame)}})})();
</script></body></html>
